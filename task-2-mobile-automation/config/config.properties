# --------------------------------------------------------------------
# Environment configuration. Override any of these with -D system
# properties, e.g.:
#   mvn test -Dplatform=ios -DdeviceName="iPhone 15"
# --------------------------------------------------------------------

# android | ios
platform=android

appium.server.url=http://127.0.0.1:4723

# --- Android ---
android.deviceName=Pixel_7_API_34
android.platformVersion=14
android.automationName=UiAutomator2
android.appPackage=org.wikipedia
android.appActivity=org.wikipedia.main.MainActivity
# Path to the Wikipedia APK. Download from Play Store / APK mirror and
# place it here, or point this at an already-installed app and drop
# the "app" capability in DriverManager in favour of appPackage/appActivity.
android.appPath=./apps/wikipedia.apk

# --- iOS ---
ios.deviceName=iPhone 15
ios.platformVersion=17.5
ios.automationName=XCUITest
ios.bundleId=org.wikimedia.wikipedia
ios.appPath=./apps/wikipedia.app

implicit.wait.seconds=10
explicit.wait.seconds=20
